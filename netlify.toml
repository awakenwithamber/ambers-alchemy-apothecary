# ── Server source is not public ────────────────────────────────
# publish = "." uploads the whole repo, so these server-side folders and files
# would otherwise be downloadable. Netlify matches functions with a
# `config.path` (all /api/* endpoints) BEFORE any redirect, so these rules
# never shadow a function; they only turn stray source paths — and unknown
# /api/* URLs — into a real 404 instead of the file or the SPA page.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true

# ── SPA catch-all (must be last) ───────────────────────────────
# Netlify's request order is: functions with `config.path` → redirects →
# static files. /api/* endpoints (checkout, checkout-config, stripe-webhook,
# order-status, lunna, form-submit, reviews) therefore always win over this
# rule; nothing here needs `force` or a per-function exception.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
