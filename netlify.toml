[build]
  publish = "."
  functions = "netlify/functions"

# ── Security headers ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://awakenagain.com"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# ── Canonical clean paths ───────────────────────────────────
# The site is a single-page app: every section lives in index.html and
# navigation-history.js maps the path to a section. Canonical section paths:
#   /shop /soaps /services /custom-formula /herbal-wisdom (Facts & Articles)
#   /herbal-library (Herb & Ingredient Library) /herb-index /about /faqs
#   /contact /search. The Living Grimoire is /grimior (grimior.html).
# Earlier rules here pointed at files that do not exist (herbal-index.html,
# grimoir.html, articles.html, create-remedy.html) and returned 404s.

[[redirects]]
  from = "/grimior"
  to = "/grimior.html"
  status = 200

[[redirects]]
  from = "/grimoire"
  to = "/grimior"
  status = 301

[[redirects]]
  from = "/grimoire.html"
  to = "/grimior"
  status = 301

[[redirects]]
  from = "/living-grimoire"
  to = "/grimior"
  status = 301

[[redirects]]
  from = "/grimoir.html"
  to = "/grimior"
  status = 301

