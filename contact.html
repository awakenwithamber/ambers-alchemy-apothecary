<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Amber's Alchemy Apothecary</title>
  <meta name="description" content="Contact Amber Lynn Patten at Amber's Alchemy Apothecary — questions about handcrafted botanical remedies, custom formulas, orders, and the Living Grimoire." />
  <link rel="canonical" href="https://awakenagain.com/contact.html" />
  <meta property="og:site_name" content="Amber's Alchemy Apothecary" />
  <meta property="og:title" content="Contact | Amber's Alchemy Apothecary" />
  <meta property="og:description" content="Reach Amber — handcrafted botanical remedies, custom formulas, and the Living Grimoire." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://awakenagain.com/contact.html" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Amber's Alchemy Apothecary",
    "parentOrganization": { "@type": "Organization", "name": "Awaken With Amber LLC" },
    "founder": { "@type": "Person", "name": "Amber Lynn Patten" },
    "url": "https://awakenagain.com/",
    "email": "awaken@consultant.com",
    "telephone": "+1-801-414-8984"
  }
  </script>
  <style>
    :root {
      --deep-purple: #1e1148;
      --plum: #2c1a5e;
      --gold: #d4af37;
      --gold-soft: #e8c96a;
      --cream: #f5efe0;
      --ink: #241a3f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(ellipse at 50% 0%, var(--plum) 0%, var(--deep-purple) 60%, #120a2e 100%);
      color: var(--cream);
      min-height: 100vh;
      line-height: 1.6;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 {
      color: var(--gold);
      font-size: 2.2rem;
      margin: 0 0 0.25rem;
      letter-spacing: 0.04em;
    }
    header p { color: #cbbde8; margin: 0.25rem 0; font-style: italic; }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(4px);
    }
    .card h2 { color: var(--gold-soft); margin-top: 0; font-size: 1.3rem; }
    .contact-lines { list-style: none; padding: 0; margin: 0; }
    .contact-lines li { margin: 0.7rem 0; font-size: 1.05rem; }
    .contact-lines .label { color: var(--gold); display: inline-block; min-width: 4.5rem; }
    a { color: var(--gold-soft); }
    a:hover { color: #fff2c9; }
    form label { display: block; margin: 1rem 0 0.35rem; color: var(--gold-soft); font-size: 0.95rem; }
    form input, form textarea, form select {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(18, 10, 46, 0.7);
      color: var(--cream);
      font-size: 1rem;
      font-family: inherit;
    }
    form input:focus, form textarea:focus, form select:focus {
      outline: 2px solid var(--gold);
      outline-offset: 1px;
    }
    form textarea { min-height: 130px; resize: vertical; }
    .hint { font-size: 0.85rem; color: #b9a8dd; }
    button[type="submit"] {
      margin-top: 1.25rem;
      background: linear-gradient(135deg, var(--gold) 0%, #b8912c 100%);
      color: var(--deep-purple);
      border: none;
      border-radius: 10px;
      padding: 0.85rem 2rem;
      font-size: 1.05rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    button[type="submit"]:hover { filter: brightness(1.1); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
    #form-status { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 8px; display: none; }
    #form-status.ok { display: block; background: rgba(120, 200, 140, 0.15); border: 1px solid #78c88c; }
    #form-status.err { display: block; background: rgba(220, 130, 130, 0.12); border: 1px solid #d88a8a; }
    .home-link { display: inline-block; margin-top: 0.5rem; }
    footer { text-align: center; color: #9d8cc7; font-size: 0.85rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Amber's Alchemy Apothecary</h1>
      <p>Handcrafted botanical remedies &amp; the Living Grimoire</p>
      <p>Awaken With Amber LLC</p>
    </header>

    <section class="card" aria-labelledby="reach-heading">
      <h2 id="reach-heading">Reach Amber</h2>
      <ul class="contact-lines">
        <li><span class="label">Name</span> Amber Lynn Patten</li>
        <li><span class="label">Email</span> <a href="mailto:awaken@consultant.com">awaken@consultant.com</a></li>
        <li><span class="label">Phone</span> <a href="tel:+18014148984">(801) 414-8984</a></li>
      </ul>
    </section>

    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Send a message</h2>
      <form id="contact-form" novalidate>
        <label for="cf-name">Your name</label>
        <input type="text" id="cf-name" name="name" autocomplete="name" required />

        <label for="cf-email">Your email</label>
        <input type="email" id="cf-email" name="email" autocomplete="email" required />

        <label for="cf-phone">Your phone <span class="hint">(optional)</span></label>
        <input type="tel" id="cf-phone" name="phone" autocomplete="tel" placeholder="(801) 555-1234" />

        <label for="cf-topic">Topic</label>
        <select id="cf-topic" name="topic">
          <option>Product question</option>
          <option>Custom formula or remedy</option>
          <option>Order question</option>
          <option>Living Grimoire membership</option>
          <option>Service or booking</option>
          <option>Something else</option>
        </select>

        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" required></textarea>

        <button type="submit" id="cf-submit">Send message</button>
        <div id="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <a class="home-link" href="/">&larr; Back to AwakenAgain.com</a>

    <footer>
      &copy; Awaken With Amber LLC · Amber's Alchemy Apothecary
    </footer>
  </div>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var status = document.getElementById('form-status');
      var submit = document.getElementById('cf-submit');

      function show(msg, ok) {
        status.textContent = msg;
        status.className = ok ? 'ok' : 'err';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('cf-name').value.trim();
        var email = document.getElementById('cf-email').value.trim();
        var phone = document.getElementById('cf-phone').value.trim();
        var topic = document.getElementById('cf-topic').value;
        var message = document.getElementById('cf-message').value.trim();

        if (!name || !email || !message) {
          show('Please fill in your name, email, and message.', false);
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          show('That email address does not look valid — please check it.', false);
          return;
        }

        submit.disabled = true;
        submit.textContent = 'Sending…';

        fetch('/.netlify/functions/form-relay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ formType: 'contact', name: name, email: email, phone: phone, topic: topic, message: message })
        })
          .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
          .then(function (out) {
            if (out.res.ok && out.data.success) {
              show('Thank you, ' + name + ' — your message is on its way. Amber will reply from awaken@consultant.com.', true);
              form.reset();
            } else {
              throw new Error((out.data && out.data.error) || 'send failed');
            }
          })
          .catch(function () {
            show('The form could not send just now. Please email awaken@consultant.com or call (801) 414-8984 directly.', false);
          })
          .finally(function () {
            submit.disabled = false;
            submit.textContent = 'Send message';
          });
      });
    })();
  </script>
</body>
</html>
